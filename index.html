<style>
/* Layout: an analyst's incident queue. One column, severity-style stripes per exam domain, thumb-reach nav on phones. */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--sunk:#E3E9EE;--ink:#14202E;--muted:#536375;--line:#CCD6DF;
  --accent:#0B6470;--accent-ink:#FFFFFF;--accent-soft:#D9EDEF;
  --d1:#8A4FBF;--d2:#C2410C;--d3:#0B6470;
  --good:#17713F;--good-soft:#DDF3E5;--bad:#B3261E;--bad-soft:#FBE4E2;--warn:#8F5A00;--warn-soft:#FBEFD5;
  --code:#1B2A3A;--code-ink:#D9E6F2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D151E;--surface:#16212D;--sunk:#101A25;--ink:#E6EDF4;--muted:#9DACBB;--line:#2C3B4B;
  --accent:#55C4CE;--accent-ink:#06222A;--accent-soft:#143640;
  --d1:#BC92E8;--d2:#F2915F;--d3:#55C4CE;
  --good:#5FD08F;--good-soft:#123323;--bad:#F58B84;--bad-soft:#3C1B1A;--warn:#E9B95C;--warn-soft:#352A12;
  --code:#0A1119;--code-ink:#D9E6F2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151E;--surface:#16212D;--sunk:#101A25;--ink:#E6EDF4;--muted:#9DACBB;--line:#2C3B4B;
  --accent:#55C4CE;--accent-ink:#06222A;--accent-soft:#143640;
  --d1:#BC92E8;--d2:#F2915F;--d3:#55C4CE;
  --good:#5FD08F;--good-soft:#123323;--bad:#F58B84;--bad-soft:#3C1B1A;--warn:#E9B95C;--warn-soft:#352A12;
  --code:#0A1119;--code-ink:#D9E6F2;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font:600 .72rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stripe{border-left:5px solid var(--dc,var(--accent))}
.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--muted);border-color:var(--line);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
.row>label.field{flex:1 1 160px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;min-height:48px;line-height:1.4}
.opt .key{font:600 .8rem/1.5 var(--mono);color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default;color:inherit}
.verdict{font-weight:700}.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.explain{background:var(--sunk);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
pre{background:var(--code);color:var(--code-ink);font:400 .82rem/1.55 var(--mono);padding:12px;border-radius:8px;margin:0;overflow-x:auto;white-space:pre}
code{font:400 .88em var(--mono);background:var(--sunk);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.tag{font:600 .72rem/1 var(--mono);padding:5px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.good{background:var(--good-soft);color:var(--good)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dc,var(--accent))}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .row{justify-content:space-between;flex-wrap:nowrap;gap:12px}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.85rem;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.875rem;min-width:520px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
details[open]>summary{margin-bottom:8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.qa-a{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.timer{font:600 1rem var(--mono);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:600 .72rem var(--mono);cursor:pointer;padding:0}
.dots button.done{background:var(--accent-soft);border-color:var(--accent)}
.dots button.flag{border-color:var(--warn);background:var(--warn-soft)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;align-items:center;justify-content:center;min-height:56px;font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:none;border-top:3px solid transparent}
nav.tabs a.on{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:760px){nav.tabs a{font-size:.92rem}}
.site{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px solid var(--line)}
.site:last-child{border-bottom:0;padding-bottom:0}.site:first-of-type{padding-top:0}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:12px;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fact b{display:block;font:800 1.2rem var(--display)}
.star{align-self:flex-start;min-height:40px;padding:8px 12px}
.star[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.subnav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.subnav a{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:6px;font-size:.9rem;font-weight:600;color:var(--muted);text-decoration:none}
.subnav a.on{background:var(--surface);color:var(--accent)}
textarea{width:100%;min-height:150px;background:var(--code);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;padding:12px;font:400 16px/1.5 var(--mono);resize:vertical;white-space:pre;overflow:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;min-height:40px;min-width:40px;padding:0 10px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;font:600 .85rem var(--mono);cursor:pointer}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.check .tag{flex:none}
.topic>summary{display:flex;flex-direction:column;gap:3px;list-style:none;font-weight:400;padding:0}
.topic>summary::-webkit-details-marker{display:none}
.topic[open]>summary{margin-bottom:0}
.topic>summary b{font:600 1.02rem var(--display)}
.watch{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.gterm{display:grid;grid-template-columns:minmax(68px,auto) 1fr;gap:10px;padding-block:7px;border-bottom:1px solid var(--line);font-size:.92rem}
.gterm:last-child{border-bottom:0}
.gterm b{font-family:var(--mono);font-size:.85rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:background .12s,border-color .12s}}
</style>

const href=s=>S[s]?ML+S[s]:s;
const Q=[];
/* q(domain, topic, question, correct[], wrong[], explanation, sourceKey, code?) */
function q(d,t,text,c,w,x,s,code){Q.push({d,t,text,c,w,x,s,code})}

/* ========== DOMAIN 1: Manage a security operations environment (40-45%) ========== */
const A1="Defender automation",A2="Endpoint configuration",A3="Sentinel automation",A4="Sentinel platform",A5="Data ingestion",A6="Detections";

q(1,A1,"A SOC manager wants an email only when a High-severity incident is created. Where do you configure this?",["An incident email notification rule in Microsoft Defender XDR settings"],["A Sentinel automation rule with a Send email action","An alert tuning rule","A custom detection rule with severity set to High"],"Defender XDR email notifications have their own settings area, with rules scoped by conditions such as severity. Automation rules have no built-in email action, and alert tuning hides or resolves alerts rather than notifying people.","email");
q(1,A1,"The study guide lists three types of email notification to configure in Defender XDR. Which three? (Choose three.)",["Incidents","Actions","Threat analytics"],["Secure Score changes","Custom detection rule edits"],"The skills outline names incidents, actions, and threat analytics. Learn these three as a set.","guide");
q(1,A1,"An admin script keeps triggering the same benign alert on known servers. You want those alerts closed automatically without stopping the detection for other devices. What do you use?",["An alert tuning rule scoped to those servers"],["Disable the detection in Defender for Endpoint","Isolate the servers","A device group with no automation"],"Alert tuning, formerly alert suppression, matches conditions and then hides or resolves matching alerts. Scoping it keeps the detection active everywhere else.","tune");
q(1,A1,"A team wants alerts correlated into incidents only when the devices share a device group. Which setting helps?",["Restrict correlation to within scoped device groups"],["Custom network indicators","Live response for servers","Allow or block file"],"This Defender for Endpoint advanced feature limits correlation so that a scoped analyst's incidents don't span device groups outside their view.","adv");
q(1,A1,"What changed for Automated Investigation and Response (AIR) on September 1, 2026, according to Microsoft's documentation?",["It no longer runs as a separate investigation experience and can't be triggered manually"],["It was renamed automatic attack disruption","It now requires Security Copilot SCUs","It only runs on Windows Server"],"Microsoft says AIR's detection and response capabilities are part of the default antivirus stack and run automatically. For an on-demand investigation, run a full antivirus scan. The exam objective still mentions AIR, so know both the classic concepts and this change.","air");
q(1,A1,"You want remediation to run automatically, except on files in operating system directories, which need approval. Which automation level fits?",["Semi - require approval for core folders remediation"],["Full - remediate threats automatically","Semi - require approval for all folders","No automated response"],"Core folders include directories such as \\windows\\*. Files there wait for approval, and files in other folders are remediated automatically.","air");
q(1,A1,"An action awaiting approval in the Action Center is ignored for seven days. What happens?",["It times out and behaves as if it was rejected"],["It runs automatically","It escalates to Global Administrators","It stays pending until someone acts"],"Microsoft's documentation states that pending actions time out after seven days, and a timed-out action behaves the same as a rejected one.","air");
q(1,A1,"Where do you review remediation actions that Full automation already completed?",["Action Center, History tab"],["Action Center, Pending tab","Advanced hunting schema","Secure Score"],"Completed actions are on the History tab and can be undone if needed. Actions awaiting approval are on the Pending tab.","air");
q(1,A1,"Your CFO's laptop and an important service account must never be contained automatically during attack disruption. What do you configure?",["Automated response exclusions for those assets"],["An alert tuning rule that hides all their alerts","A lower automation level for all devices","Removal of those assets from Defender for Endpoint"],"Microsoft lets you exclude supported users, devices, and IP addresses from automated containment. The other options reduce protection far more widely.","ab");
q(1,A1,"Which statement about automatic attack disruption is correct?",["It acts on correlated incident-level signals, and analysts can undo its actions"],["It only blocks a single indicator of compromise","It needs a custom playbook for every action","Its actions are permanent"],"Disruption evaluates the whole attack across workloads at a stated 99% or higher confidence for containment actions. All automatic actions can be undone by your team.","ab");

q(1,A2,"Analysts must run an in-house unsigned PowerShell script during live response. What must be enabled? (Choose two.)",["Live response","Live response unsigned script execution"],["Custom network indicators","Restrict correlation to within scoped device groups"],"Live response and unsigned script execution are separate advanced features. Microsoft warns that allowing unsigned scripts can increase your exposure.","lr");
q(1,A2,"URL and IP indicators are not being enforced in Chrome. Which configuration is required?",["Custom network indicators enabled, with network protection in block mode"],["Tamper protection turned off","A Sentinel Threat Intelligence connector","Live response enabled"],"Edge can use SmartScreen, but other browsers rely on network protection, so network protection must be on in block mode.","ind");
q(1,A2,"A file hash is confirmed malicious. You want to prevent it from running and also remove existing copies. Which indicator action fits?",["Block and remediate"],["Audit","Warn","Allow"],"Block execution stops the file from running. Block and remediate also removes it where found.","ind");
q(1,A2,"You need to assess the business impact of a new ASR rule before enforcing it. Which mode do you use?",["Audit"],["Block","Warn","Disabled"],"Audit mode logs what the rule would have blocked without affecting users. Review the results, add exclusions, and then move to Block.","asr");
q(1,A2,"Users should see a notice from an ASR rule but be able to continue when they have a legitimate need. Which mode do you use?",["Warn"],["Audit","Block","Not configured"],"Warn mode shows a dialog that the user can bypass. Audit shows users nothing, and Block offers no bypass.","asr");
q(1,A2,"ASR rules aren't taking effect on a device running third-party antivirus, with Defender Antivirus in passive mode. Why?",["ASR rules need Microsoft Defender Antivirus as the active antivirus"],["ASR rules only work on Windows Server","The device needs Defender for Identity","ASR rules require a Sentinel workspace"],"Check that Defender Antivirus is in active mode, because ASR depends on it. This is a common troubleshooting scenario.","asr");
q(1,A2,"Which advanced hunting filter finds ASR rule events?",["DeviceEvents | where ActionType startswith \"Asr\""],["EmailEvents | where ThreatTypes has \"Asr\"","IdentityLogonEvents | where ActionType has \"Asr\"","AlertInfo | where Title == \"ASR\""],"ASR audited and blocked events are in DeviceEvents, with ActionType values such as AsrLsassCredentialTheftBlocked and the matching Audited value.","asr");
q(1,A2,"You need all PowerShell script executions from admin workstations for hunting, without the cost and noise of collecting everything. What do you use?",["A custom data collection rule in Defender for Endpoint"],["Basic Logs for DeviceEvents","Live response on each workstation","A Sentinel workbook"],"Custom data collection expands telemetry beyond the defaults. Its rules use filters such as folder paths, process names, and network connections.","cdc");
q(1,A2,"A device matches two device groups. Which group does it join?",["The matching group with the highest rank"],["Both groups","The group created first","The group with the most devices"],"A device belongs to one group only. Rank decides the match, and unmatched devices go to the default ungrouped devices group.","dg");
q(1,A2,"You create a device group and analysts in the assigned team can't see its devices. What should you check first?",["Whether their Microsoft Entra group was granted access to the device group"],["Whether network protection is on","Whether the devices are in Sentinel","Whether the group is ranked last"],"Device group access works through Entra user groups linked to a role. Without that assignment, scoped analysts won't see the group's devices.","dg");
q(1,A2,"What can you set per device group in Defender for Endpoint? (Choose two.)",["The automation level","Which user groups have access"],["The Sentinel workspace retention","The Entra ID password policy"],"Each device group has an automation level and user access, which is how you apply different remediation levels to, for example, servers and workstations.","dg");

q(1,A3,"You want to assign owners, add tags, and close known-noise incidents across 12 analytics rules, with no external systems. What is the simplest option?",["An automation rule"],["A Logic Apps playbook per rule","A workbook","A summary rule"],"Automation rules handle tagging, assignment, status changes, tasks, and closure without a playbook, and they can apply across many analytics rules.","autor");
q(1,A3,"Which triggers can a Sentinel automation rule use? (Choose three.)",["When incident is created","When incident is updated","When alert is created"],["When a table is created","When a workbook is opened"],"These are the three standard triggers. Workspaces onboarded to Defender can also use Case created and Case updated triggers from Simple Flows, which is in preview.","autor");
q(1,A3,"The When alert is created trigger fires for alerts from which analytics rule types?",["Scheduled and NRT"],["Fusion only","Microsoft security rules only","All Defender XDR alerts"],"Microsoft's documentation limits this trigger to alerts from Sentinel Scheduled or NRT analytics rules.","autor");
q(1,A3,"When should you normally build automation on incidents rather than alerts?",["For most use cases, because incidents hold the evolving attack story and can be enriched"],["Never, because alerts contain more data","Only for Defender XDR","Only when there are no entities"],"Microsoft calls an incident a case file that holds alerts, entities, comments, and more, so it recommends incident-triggered automation for most scenarios.","autor");
q(1,A3,"An automation rule can't run your playbook, although the Logic App works. What is the likely missing piece?",["Sentinel's service account lacks permissions on the playbook's resource group"],["The analyst lacks Microsoft Sentinel Reader","The workspace is on the data lake tier","The workbook isn't published"],"Sentinel uses a service account to run playbooks from automation rules, and it needs explicit permission on that resource group. The person granting this needs Owner.","roles");
q(1,A3,"Which built-in role is meant for the Sentinel service account, not user accounts?",["Microsoft Sentinel Automation Contributor"],["Microsoft Sentinel Playbook Operator","Microsoft Sentinel Responder","Logic App Contributor"],"Automation Contributor lets Sentinel add playbooks to automation rules. Microsoft's table says it isn't used for user accounts.","roles");
q(1,A3,"An analyst must run existing playbooks but not edit them. Which role is the least privilege?",["Microsoft Sentinel Playbook Operator"],["Logic App Contributor","Microsoft Sentinel Contributor","Owner"],"Playbook Operator can list, view, and manually run playbooks. Logic App Contributor can also create and edit them.","roles");
q(1,A3,"What technology are Sentinel playbooks built on?",["Azure Logic Apps"],["Azure Functions only","Power BI","Azure Automation DSC"],"Playbooks are Logic Apps, which are separate Azure resources. That is why they have their own permissions, and why you should assign roles at resource group level.","roles");
q(1,A3,"An analyst wants to run a playbook manually against one IP address from an investigation. Which playbook trigger supports this?",["Entity trigger"],["Recurrence trigger","Workbook trigger","Summary rule trigger"],"Sentinel playbooks use incident, alert, or entity triggers. Entity playbooks run on demand against an entity such as an account, host, or IP.","pb");

q(1,A4,"A tier 1 analyst must update and close incidents, but must not edit analytics rules. Which role is the least privilege?",["Microsoft Sentinel Responder"],["Microsoft Sentinel Reader","Microsoft Sentinel Contributor","Owner"],"Responder has Reader permissions plus incident management. Reader can't manage incidents, and Contributor grants rule editing.","roles");
q(1,A4,"A Sentinel Reader must also create and edit workbooks, and nothing else. What do you add?",["Workbook Contributor"],["Microsoft Sentinel Contributor","Logic App Contributor","Log Analytics Contributor at subscription scope"],"Microsoft's role table notes that Reader and Responder can edit workbooks with the Workbook Contributor role.","roles");
q(1,A4,"Where does Microsoft recommend assigning Sentinel roles?",["On the resource group that contains the workspace"],["On each individual table","On the management group root","On each playbook only"],"Assigning at resource group level covers related resources such as Logic Apps. If you assign at the workspace, you must also assign to the SecurityInsights solution resource.","roles");
q(1,A4,"Which access model governs Sentinel data lake roles, as opposed to SIEM roles?",["Microsoft Entra ID RBAC"],["Exchange RBAC","SharePoint permissions","Local AD groups"],"Sentinel uses Azure RBAC for SIEM and Entra ID RBAC for the data lake. Expect questions that test this split.","roles");
q(1,A4,"What is the default analytics retention for Sentinel data, and how far can it be extended?",["30 days by default, extendable to two years"],["7 days, extendable to 30 days","90 days, fixed","1 year, extendable to 12 years"],"Microsoft's tiers page says 30 days by default. Solution tables can extend to 90 days at no charge. Total retention, using the lake, can reach 12 years.","tiers");
q(1,A4,"You must retain firewall logs for seven years for compliance at the lowest cost, with occasional investigation. Which option fits?",["Keep them in the Data Lake tier"],["Keep them in analytics retention for seven years","Export them to a workbook","Store them in a watchlist"],"Analytics retention stops at two years. The lake is low cost, supports up to 12 years of total retention, and is designed for compliance and forensics.","tiers");
q(1,A4,"After you move a table from Analytics to Data Lake only, which feature stops working on it?",["Real-time analytics rules"],["KQL jobs","Notebooks","Scheduled Spark jobs"],"Data Lake tier data isn't available for real-time analytics features. You reach it with KQL jobs, Spark jobs, notebooks, and summary rules.","tiers");
q(1,A4,"How long is Defender XDR threat hunting data available in the Analytics tier by default?",["30 days"],["7 days","180 days","12 years"],"XDR data has 30 days by default. Extending to 90 days incurs ingestion costs but free storage. Beyond 90 days, storage costs apply too.","tiers");
q(1,A4,"You see a Basic Logs table in the Defender portal and can't change its settings there. Why?",["Basic Logs tables can only be managed from the Log Analytics workspace today"],["You need the Global Administrator role","Basic Logs can never be changed","The table must first be archived"],"Microsoft's tiers page says you can view Basic Logs tables in Defender, but manage them in Log Analytics unless you change the table plan to Analytics.","tiers");
q(1,A4,"Which built-in view on the Tables page shows ingestion volume, last data received, and estimated daily cost for each table?",["Table insights"],["SOC optimization","MITRE ATT&CK page","Threat analytics"],"Table insights helps spot connector failures and cost spikes. Microsoft notes that it isn't billing-grade or an alerting surface.","tiers");
q(1,A4,"Which feature recommends reducing unused data and closing detection gaps against specific threats?",["SOC optimization"],["Workbooks","Alert tuning","Automation rules"],"SOC optimization gives data value and threat-based coverage recommendations. It's a named item in the skills outline.","soc");
q(1,A4,"You need an interactive dashboard of Sentinel data for SOC leads. What do you create?",["A workbook"],["A playbook","A hunting query","An automation rule"],"Workbooks visualize and monitor data. Playbooks automate, and hunting queries search.","wb");
q(1,A4,"After what date will Sentinel be supported only in the Microsoft Defender portal?",["March 31, 2027"],["July 1, 2026","December 31, 2026","March 31, 2028"],"The original July 2026 date was extended. Older study material often still shows the earlier date.","portal");

q(1,A5,"A Windows Security Events via AMA connector writes to which table?",["SecurityEvent"],["WindowsEvent","Syslog","CommonSecurityLog"],"AMA security events go to SecurityEvent, which many built-in rules query. Forwarded events go to WindowsEvent.","win");
q(1,A5,"You use WEF because agents can't be installed on some machines, and built-in rules now don't match your data. Why?",["Forwarded events land in WindowsEvent, and many rules query SecurityEvent"],["WEF encrypts all event IDs","WEF only collects Sysmon","Rules can't run on Windows data"],"Microsoft says to use the AMA connector if you need those rules unchanged. Otherwise, adapt rules to WindowsEvent or supported ASIM parsers.","win");
q(1,A5,"Which object defines what Azure Monitor Agent collects and where it sends the data?",["A data collection rule (DCR)"],["A watchlist","A workbook","A summary rule"],"The DCR specifies sources, optional transformations, and destinations. Windows Security Events via AMA is configured through DCRs.","win");
q(1,A5,"You only want Event ID 4688 and a few others from Windows servers. How do you scope collection?",["Use a custom XPath query in the DCR"],["Set the event set to All and delete rows later","Use a workbook filter","Create an alert tuning rule"],"Event sets are All, Common, Minimal, and Custom. Custom XPath filters at the source, which lowers cost.","win");
q(1,A5,"On-premises Windows servers must send events through AMA. What must you do first?",["Connect the servers with Azure Arc"],["Migrate them to Azure Virtual Desktop","Install Defender for Identity","Enable Microsoft Purview Audit"],"AMA on non-Azure machines requires Azure Arc. Expect this in on-premises scenarios.","win");
q(1,A5,"You are running both a legacy agent and AMA on the same source during migration. What is the risk?",["Duplicate events and double ingestion charges"],["All rules are disabled","The workspace is deleted","Retention drops to seven days"],"Microsoft warns that collecting the same data through two agent types causes duplicates and double ingestion charges.","best");
q(1,A5,"What collects CEF logs from a firewall that can't run an agent?",["A Linux log forwarder running AMA with rsyslog or syslog-ng"],["The firewall's own AMA install","A Windows Event Collector","A Logic App"],"The appliance sends to a Linux forwarder that has rsyslog or syslog-ng, and AMA ships the data onward. The setup includes running an installation script on the forwarder.","cef");
q(1,A5,"Which tables receive Syslog and CEF data through AMA? (Choose two.)",["Syslog","CommonSecurityLog"],["SecurityEvent","WindowsEvent"],"Syslog messages go to Syslog, and CEF messages go to CommonSecurityLog.","cef");
q(1,A5,"You use one forwarder for Syslog and CEF and see the same messages in both tables. What should you check?",["Whether the DCRs collect the same facilities and severities"],["Whether the analytics rule is disabled","Whether Defender for Cloud Apps is on","Whether the workspace retention is 30 days"],"Overlapping DCR facilities can cause duplicate ingestion. Use separate facilities, or filter with a transformation.","cef");
q(1,A5,"You need Azure Activity logs from 40 subscriptions, including new ones. What is the recommended approach?",["Use the Azure Activity connector's Azure Policy to deploy diagnostic settings"],["Configure each subscription by hand each month","Install AMA on all VMs","Use the Office 365 connector"],"The connector uses a policy assignment. Run a remediation task so that existing subscriptions are covered too.","conn");
q(1,A5,"A partner shares indicators through a TAXII server. What do you use to ingest them?",["The Threat Intelligence TAXII data connector"],["The Syslog via AMA connector","A hunting bookmark","Alert tuning"],"Sentinel supports TAXII feeds through a connector, as well as upload APIs and Microsoft's threat intelligence feed.","ti");
q(1,A5,"What suffix do custom log tables have?",["_CL"],["_SRCH","_XDR","_LAKE"],"Custom tables end in _CL. Search job results tables end in _SRCH. Both are visible on the Tables page.","tiers");
q(1,A5,"An app needs to send custom JSON logs to a new workspace table through a modern route. What do you use?",["The Logs Ingestion API with a DCR and a custom table"],["The HTTP Data Collector API as the only option","A workbook","A watchlist"],"The Logs Ingestion API sends data through a DCR to a custom table that you create first. The DCR can also transform the data.","cust");

q(1,A6,"A custom detection on Defender for Endpoint tables should scope alerts to the right device group and build the process tree. Which columns should it return?",["DeviceId and ReportId"],["AccountDisplayName and City","FileName and SHA256 only","AlertId and Title"],"Microsoft recommends Timestamp or TimeGenerated, plus DeviceId and ReportId for Endpoint tables, for correct scoping and process tree view.","cdr");
q(1,A6,"Why should you avoid filtering a custom detection on Timestamp in the query?",["The service already prefilters data based on the detection's lookback"],["KQL doesn't support Timestamp","It deletes old events","It disables entity mapping"],"Filter on time only when you want a specific subset of the lookback window. A common hunting habit is not always right in a detection.","cdr");
q(1,A6,"Which columns let the wizard automatically map an impacted account? (Choose two.)",["AccountObjectId","AccountUpn"],["RemoteUrl","FileName"],"Strong account identifiers include AccountObjectId, AccountSid, AccountUpn, and the InitiatingProcess equivalents.","cdr");
q(1,A6,"Which option links a custom detection's alerts to a threat analytics report?",["The rule's Threat analytics report setting"],["A watchlist alias","An automation rule tag","A workbook parameter"],"The alert details let you link an existing report, so that the alert appears in that report's Related incidents tab.","cdr");
q(1,A6,"How often does an NRT analytics rule run?",["Every minute"],["Every 5 minutes","Every 15 minutes","Every hour"],"NRT rules are hard-coded to run each minute. They capture events ingested in the preceding minute, on a two-minute delay.","nrt");
q(1,A6,"What is a documented limit of NRT rules?",["No more than 50 per customer, and only for sources with under 12 hours of ingestion delay"],["They can't map entities","They can't create incidents","They only work on the Data Lake tier"],"NRT rules still support entity mapping, incident grouping, suppression, and automation.","nrt");
q(1,A6,"Why do NRT rules avoid the ingestion delay problem of scheduled rules?",["They query on ingestion time rather than TimeGenerated"],["They run on the source device","They read from archive","They ignore delayed events entirely"],"Scheduled rules run on a built-in five-minute delay. NRT rules use a two-minute delay and query on ingestion time.","nrt");
q(1,A6,"What is the maximum lookback for a scheduled analytics rule query?",["14 days"],["1 day","30 days","90 days"],"Scheduled rules can run every 5 minutes to every 14 days, and look back up to 14 days.","sch");
q(1,A6,"Each alert from a noisy rule creates a separate incident for the same user. What do you adjust?",["The rule's alert grouping in its incident settings"],["The workspace retention","The table tier","The DCR XPath"],"Alert grouping can combine related alerts into one incident, for example by matching entities within a time window.","threat");
q(1,A6,"You want analysts to see host and account entities on Sentinel alerts. What do you configure in the rule?",["Entity mapping"],["A summary rule","A data collection rule","Table insights"],"Entity mapping links query columns to entity types, enabling the investigation graph, entity pages, and UEBA context.","sch");
q(1,A6,"You want to see which ATT&CK techniques your active rules cover, and how adding templates would change that. What do you use?",["The MITRE ATT&CK page, including simulated coverage"],["Threat analytics","Table insights","Secure Score"],"The page shows active detections and can simulate coverage using available detections. Microsoft marks it as preview.","mitre");
q(1,A6,"What is true of a single Sentinel anomaly?",["It isn't necessarily malicious, but it's useful for detection, investigation, and hunting context"],["It's always a true positive","It automatically disables the user","It only applies to email"],"Microsoft says one anomaly isn't a strong signal, whereas several across the kill chain are. Anomalies can condition other detections.","anom");
q(1,A6,"Which table do you query for the results of customizable anomalies?",["Anomalies"],["AlertInfo","SigninLogs","SecurityIncident"],"Anomalies are written to the Anomalies table, so you can use them in queries, conditional detections, and hunts.","anom");
q(1,A6,"Per current Microsoft guidance on the anomalies page, what's the recommended way to create new rules across Sentinel and Defender XDR?",["Custom detections"],["Fusion rules","Legacy hunting livestreams","Azure Monitor alerts"],"The page calls custom detections the best way to create new rules across both. Scheduled and NRT rules remain on the exam.","anom");

/* ========== DOMAIN 2: Respond to security incidents (35-40%) ========== */
const B1="Defender for Office 365",B2="Microsoft Purview",B3="Defender for Cloud",B4="Defender for Cloud Apps",B5="Entra ID",B6="Defender for Identity",B7="Sentinel incidents",B8="AI agents and Copilot",B9="Complex attacks",B10="Case management",B11="Endpoint response",B12="Attack disruption response",B13="Microsoft 365 investigation";

q(2,B1,"A phishing message reached 300 mailboxes. You have Defender for Office 365 Plan 2. Where can you find it and take bulk action to remove it?",["Threat Explorer"],["Secure Score","Workbooks","Exposure Management"],"Threat Explorer in Plan 2 finds messages and supports remediation such as soft or hard delete. Plan 1 has Real-time detections, without the same range of actions.","expl");
q(2,B1,"A message was clean at delivery and is later identified as malware. What removes it automatically from mailboxes?",["Zero-hour auto purge (ZAP)"],["Tenant Allow/Block List","Alert tuning","An ASR rule"],"ZAP acts on messages already delivered to Exchange Online mailboxes when their verdict changes.","zap");
q(2,B1,"You need to block a known malicious sender domain across the tenant now. What do you use?",["Tenant Allow/Block List"],["An Entra Conditional Access policy","A device group","A Sentinel summary rule"],"The Tenant Allow/Block List manages block entries for senders, URLs, files, and more.","tabl");
q(2,B1,"Which advanced hunting table shows who clicked a malicious link protected by Safe Links?",["UrlClickEvents"],["EmailAttachmentInfo","DeviceImageLoadEvents","IdentityQueryEvents"],"UrlClickEvents records Safe Links clicks. EmailUrlInfo only tells you which URLs were in messages.","schema");
q(2,B1,"An adversary-in-the-middle phish stole a session token. Resetting the password alone isn't enough. What must you also do?",["Revoke the user's sessions and refresh tokens"],["Disable the mailbox's audit log","Remove the device from Intune","Change the tenant's name"],"A stolen token may stay valid after a password reset. Automatic attack disruption can also revoke sessions and disable or suspend the user.","ab");

q(2,B2,"You need to investigate a DLP alert with correlated endpoint and identity signals. Where is the best place to work?",["The unified incident queue in the Microsoft Defender portal"],["A Sentinel workbook","Azure Cost Management","Intune compliance reports"],"Purview DLP alerts appear in Defender XDR incidents, so you can correlate them with other signals.","dlp");
q(2,B2,"A Purview Insider Risk case shows pseudonymized user names. Why?",["Insider Risk Management anonymizes usernames by default for privacy"],["The account was deleted","The data lake tier hides names","Defender for Identity is off"],"Anonymization limits bias and protects privacy. Authorized roles can change this in settings.","irm");
q(2,B2,"Which Sentinel graph-powered Purview capability helps show which risky files, users, and exfiltration paths are in scope for a breach?",["Data Security Investigations graphs"],["Content search KQL","Secure Score","Attack Simulation Training"],"Microsoft describes these graphs as pointing out sensitive data access and movement and mapping possible exfiltration paths.","graph");

q(2,B3,"Which Defender for Cloud plan generates an alert for malware uploaded to a blob container?",["Defender for Storage"],["Defender for Key Vault","Defender for DNS","Defender CSPM only"],"Defender for Storage covers threats to storage accounts, including malware scanning.","mdc");
q(2,B3,"A Kubernetes cluster shows a suspicious privileged container. Which plan raises this?",["Defender for Containers"],["Defender for Resource Manager","Defender for Storage","Defender for App Service"],"Defender for Containers provides runtime protection and control plane analysis for Kubernetes.","mdc");
q(2,B3,"An alert describes suspicious management operations across subscriptions through ARM. Which plan is this from?",["Defender for Resource Manager"],["Defender for SQL","Defender for Storage","Defender for Containers"],"Defender for Resource Manager monitors management operations in your subscriptions.","mdc");
q(2,B3,"On a Defender for Cloud alert, where do you find mitigation steps and options for automated response or suppression?",["The alert's Take action tab"],["The workspace's Tables page","Secure Score history","Advanced hunting schema"],"Take action covers inspecting resource context, mitigating the threat, preventing future attacks, triggering automated response, and suppressing similar alerts.","mdc");
q(2,B3,"A known scanner keeps generating one Defender for Cloud alert. You want it dismissed automatically, but still recorded. What do you create?",["A suppression rule"],["A DCR","An ASR rule","A resource lock"],"Suppression rules automatically dismiss matching alerts, and you can still view dismissed alerts.","sup");
q(2,B3,"When a high-severity Defender for Cloud alert fires, a Logic App must open a ticket. Which feature triggers this?",["Workflow automation"],["SOC optimization","Search jobs","Live response"],"Workflow automation triggers Logic Apps from alerts and recommendations.","wfa");

q(2,B4,"Which Cloud Apps capability helps you find and assess unsanctioned SaaS apps used on your network?",["Cloud Discovery"],["Conditional Access App Control","ASR rules","Attack disruption"],"Cloud Discovery analyzes traffic logs to reveal shadow IT and show risk scores. You can then mark apps as sanctioned or unsanctioned.","disc");
q(2,B4,"Users on unmanaged devices must be able to read files in a SaaS app but not download them. What do you configure?",["A session policy through Conditional Access App Control"],["A Cloud Discovery report","A device group","An anomaly detection policy"],"Session policies work in real time and can block downloads based on device state. Entra Conditional Access routes the session.","sess");
q(2,B4,"A user consented to a risky OAuth app with broad mail permissions. Where can you investigate and ban or revoke it?",["The OAuth apps page in Defender for Cloud Apps"],["Device timeline","Threat Explorer's URL tab","Table insights"],"The OAuth apps view shows permission level and users, and you can ban the app. OAuth app compromise is also an attack disruption scenario.","oauth");
q(2,B4,"Which alert type is an example of a built-in anomaly detection in Defender for Cloud Apps?",["Impossible travel"],["ASR rule audit","Kerberoasting","Hash indicator block"],"Cloud Apps anomaly policies include impossible travel, mass download, and ransomware activity. Kerberoasting is a Defender for Identity detection.","mda");
q(2,B4,"Which hunting table shows activity across connected SaaS apps?",["CloudAppEvents"],["DeviceRegistryEvents","Syslog","AADRiskyUsers"],"CloudAppEvents has activities from Microsoft 365 and other connected apps.","schema");

q(2,B5,"An analyst has verified that a risky user's account really is compromised. What should they do in Identity Protection?",["Confirm the user compromised"],["Dismiss the user's risk","Delete the sign-in logs","Add the user to Named Locations"],"Confirming sets the user's risk to high and teaches the system. Dismiss is for benign activity.","idp");
q(2,B5,"Which control best remediates high user risk for a password-hash-synced user?",["A secure password change"],["Assigning a new license","Enabling a workbook","Adding a tag"],"User risk is about credentials, so a secure password change, typically required by a risk-based Conditional Access policy, remediates it.","rem");
q(2,B5,"Which control is typically used to remediate sign-in risk?",["Multifactor authentication"],["Password expiry reminder","Device rename","Group naming policy"],"When a user passes MFA on a risky sign-in, the risk is self-remediated, so MFA is the standard response.","rem");
q(2,B5,"What does ResultType \"0\" mean in SigninLogs?",["The sign-in succeeded"],["The password was wrong","The account is locked","Conditional Access failed"],"A value of 0 means success. Non-zero values are error codes, such as 50126 for invalid credentials.","kql");
q(2,B5,"Which tables hold Identity Protection data in Sentinel when enabled through the Entra connector? (Choose two.)",["AADRiskyUsers","AADUserRiskEvents"],["DeviceFileEvents","CommonSecurityLog"],"These tables are selected in the Microsoft Entra ID connector, along with others such as SigninLogs and AuditLogs.","conn");

q(2,B6,"An account that isn't a domain controller requests directory replication of password data. Which alert is most likely?",["Suspected DCSync attack"],["Impossible travel","Mass download","Malicious OAuth app"],"DCSync abuses replication permissions. Defender for Identity sensors on domain controllers detect it.","mdi");
q(2,B6,"An attacker requests service tickets for accounts with SPNs to crack them offline. What is the technique, and the best hardening?",["Kerberoasting; use long random passwords or gMSAs for service accounts"],["Pass-the-hash; disable DNS","Password spray; shorten password length","Phishing; turn off MFA"],"Service tickets are encrypted with the service account's key. Long or managed passwords make them impractical to crack.","mdi");
q(2,B6,"A Golden Ticket is suspected. What is the key remediation?",["Reset the KRBTGT password twice, with appropriate replication time between resets"],["Restart all workstations","Turn off Kerberos","Delete all user accounts"],"Two resets are needed because the account keeps its password history. Allow time for replication between them.","mdi");
q(2,B6,"Which tab on an identity's page in the Defender portal visualizes potential lateral movement paths involving or leading to that identity?",["Attack paths"],["Secure Score","Threat Explorer","Attack Simulation Training"],"The Attack paths tab shows these routes. Older study material describes Defender for Identity's lateral movement path reports, but Microsoft's newer identity pages present this through attack paths and the hunting graph.","lmp");
q(2,B6,"Defender for Identity can disable a user in on-premises AD from the portal. What identity does it use?",["A configured action account, by default the sensor's LocalSystem on the DC, or a gMSA"],["The analyst's password","The Global Administrator","An Exchange transport rule"],"Remediation actions on AD run using the sensor's identity or a specified gMSA.","mdia");
q(2,B6,"Which table holds LDAP queries captured by Defender for Identity?",["IdentityQueryEvents"],["IdentityLogonEvents","EmailEvents","DeviceNetworkEvents"],"IdentityQueryEvents captures queries such as LDAP, IdentityLogonEvents captures authentication, and IdentityDirectoryEvents captures directory changes.","schema");

q(2,B7,"During a Sentinel investigation you find useful query results and want to keep them for an incident. What do you create?",["A bookmark"],["A summary rule","A DCR","An alert tuning rule"],"Bookmarks save query results with notes and can be attached to incidents. They are stored in the HuntingBookmark table.","book");
q(2,B7,"You want every phishing incident to show the same checklist of analyst steps. What do you use?",["Incident tasks, added by an automation rule"],["A watchlist","Custom data collection","A workbook only"],"Incident tasks standardize workflows. Automation rules or playbooks can add them automatically.","tasks");
q(2,B7,"How do you reference a watchlist in a KQL query?",["_GetWatchlist('alias')"],["Watchlist.Read(alias)","get-watchlist alias","externaldata('alias')"],"The _GetWatchlist function returns the watchlist rows, which you can join to logs, for example to exclude known scanners.","watch");
q(2,B7,"Which capability builds baselines and shows user or host behavior anomalies on Sentinel entity pages?",["UEBA"],["Table insights","Search jobs","Content hub"],"User and Entity Behavior Analytics provides peer and behavioral baselines. Its data appears on entity pages and in tables such as BehaviorAnalytics.","ueba");
q(2,B7,"An alert was accurate, but the activity was expected, such as an approved penetration test. Which closing classification fits?",["Benign positive"],["True positive","False positive - incorrect data","Undetermined"],"Benign positive means suspicious activity that is expected. False positive means the alert logic or data is wrong.","close");
q(2,B7,"After onboarding Sentinel to the Defender portal, what is the main change for incident queues?",["SIEM and XDR incidents share one unified queue"],["Sentinel incidents stop being created","Defender incidents move to the Azure portal","Each workload gets its own queue"],"Microsoft describes a unified queue with automatic cross-domain correlation.","portal");

q(2,B8,"You enabled the Phishing Triage Agent but it skips reported phishing alerts. What should you check?",["Whether the built-in alert tuning rule auto-resolves those alerts"],["Whether Defender for IoT is on","Whether the workspace uses Basic Logs","Whether analysts have Playbook Operator"],"The agent doesn't triage alerts that tuning has resolved, so that rule must be disabled.","pta");
q(2,B8,"What does the Phishing Triage Agent do with a user-reported email that it judges a real threat?",["Keeps the alert open for an analyst"],["Deletes the sender's tenant","Closes it as false positive","Disables the reporting user"],"True positives stay open for an analyst to act on, and false alarms are resolved as false positives.","pta");
q(2,B8,"What prerequisites does the Phishing Triage Agent have? (Choose two.)",["Security Compute Units for Security Copilot","Defender for Office 365 Plan 2"],["Defender for IoT","A Sentinel data lake KQL job"],"The agent also needs the Email reported by user as malware or phish alert policy.","pta");
q(2,B8,"You remove the Phishing Triage Agent and later reinstall it. What should you expect?",["Earlier analyst feedback is gone"],["Its feedback is preserved","All incidents are deleted","Plan 2 is canceled"],"Microsoft's documentation states that removing the agent deletes the feedback analysts provided.","pta");
q(2,B8,"Which agent extends phishing triage to some identity alerts, such as password spray, and cloud container alerts?",["Security Alert Triage Agent (preview)"],["Threat Intelligence Briefing Agent","Dynamic Threat Detection Agent","Access Review Agent"],"Microsoft describes it as the same agent with extended capabilities, and it's in preview.","sata");
q(2,B8,"Which agent is designed to produce threat intelligence summaries relevant to your organization?",["Threat Intelligence Briefing Agent"],["Phishing Triage Agent","Security Analyst Agent","Attack Disruption Agent"],"Defender docs list agents including this one, the Threat Hunting Assistant, the Security Analyst Agent, and the Dynamic Threat Detection Agent.","agents");
q(2,B8,"Which tasks can embedded Security Copilot do in the Defender portal? (Choose three.)",["Summarize an incident","Provide guided response recommendations","Generate KQL from natural language"],["Deploy data collection rules to servers","Change a tenant's Entra ID licensing"],"Embedded Copilot also helps with script and file analysis, and helps build incident reports.","cop");

q(2,B9,"In the incident graph, which feature estimates the paths an attacker could take from a compromised entity to a critical asset?",["Blast radius analysis"],["Alert tuning","Table insights","Secure Score"],"Blast radius shows current impact and potential future impact in one consolidated graph.","graph");

q(3,C2,"Which operator is usually the better performance choice for finding a whole term in a string?",["has"],["contains","matches regex","startswith_cs on a concatenated string"],"has uses the term index. contains searches substrings, so it's slower. Remember has only matches whole terms of three or more characters reliably.","kqs");
q(3,C2,"Which operator is case-insensitive equality?",["=~"],["==","!=","has_cs"],"== is case sensitive and =~ is case insensitive. !~ is the case-insensitive inequality.","kqs");
q(3,C2,"What is the default join kind in KQL, if you don't specify one?",["innerunique"],["inner","leftouter","fullouter"],"innerunique deduplicates the left side on the join key. This is a classic trap, because rows can seem to go missing.","kqj");
q(3,C2,"You want accounts from a watchlist that had no sign-ins. Which join kind fits?",["leftanti"],["inner","rightouter","leftsemi"],"leftanti returns left rows with no match on the right. leftsemi returns left rows that do have a match.","kqj");
q(3,C2,"What does this query return?",["The most recent row for each device"],["The first event ever recorded","A count of events per device","One row in total"],"arg_max(Timestamp, *) returns the row with the maximum Timestamp for each group, with all columns.","kqa",`DeviceInfo

q(3,C2,"What does this query find?",["IP addresses trying many accounts, consistent with password spray"],["One user signing in from many IP addresses","Successful sign-ins only","Accounts with MFA enabled"],"Many distinct users with invalid credentials (50126) from one IP is a spray pattern. One account attacked with many passwords is brute force.","kql",`SigninLogs
| where ResultType == "50126"
| summarize Users = dcount(UserPrincipalName) by IPAddress
| where Users > 20`);
q(3,C2,"Which function groups sign-ins into 1-hour buckets?",["bin(TimeGenerated, 1h)"],["ago(1h)","now(1h)","round(1h)"],"Use bin inside summarize. ago returns a point in time relative to now.","kqb");
q(3,C2,"Where should the time filter usually go in a query?",["As early as possible"],["After the join","After render","Only at the very end"],"Filtering early reduces the data every later operator handles, and gets faster results.","kql");
q(3,C2,"Which operator splits a dynamic array into one row per element?",["mv-expand"],["summarize","extend","project-away"],"mv-expand expands multi-value columns. Use parse_json first if the value is JSON stored as a string.","kqm");
q(3,C2,"What's the difference between project and extend?",["project picks the columns to output, and extend adds calculated columns while keeping the rest"],["They are identical","extend removes columns","project sorts rows"],"Use project to reduce columns and extend to add them. project-away removes named columns.","kql");
q(3,C2,"What does this query look for?",["PowerShell launched with an encoded command argument"],["PowerShell script file downloads only","Failed PowerShell logons","Registry changes"],"Encoded commands are a common way of concealing behavior. =~ handles case, and has_any checks for any listed term.","kql",`DeviceProcessEvents
| where FileName =~ "powershell.exe"
| where ProcessCommandLine has_any ("-enc", "-encodedcommand")`);
q(3,C2,"Which statement defines a reusable variable in KQL?",["let"],["set","var","declare"],"let can name a value, a tabular expression, or a function for reuse. Each let statement ends with a semicolon.","kql");

q(3,C3,"Where do you check whether your organization is exposed to a threat in a threat analytics report, including missing updates and settings?",["The report's exposure and mitigations information"],["Sentinel Tables page","Graph activity logs","Content search"],"Threat analytics reports combine an analyst report with related incidents, impacted assets, and exposure and mitigation information.","ta");
q(3,C3,"What is a threat analytics analyst report?",["A Microsoft-written analysis of a threat, with TTPs, mitigations, and hunting guidance"],["An audit of your admins","A license report","A workspace billing export"],"Reports are written by Microsoft's security researchers, and many include advanced hunting queries.","ta");

q(3,C4,"Where are custom graphs in Sentinel (preview) built?",["In Jupyter notebooks with the sentinel_graph Python library"],["In Azure Policy","In a Logic Apps designer","In Exchange admin center"],"They use the sentinel_graph library and Graph Query Language.","cgraph");

q(3,C4,"Which Sentinel MCP tool estimates a node's reach through propagation paths toward critical assets?",["find_blastradius"],["query_lake","search_tables","summarize_rule"],"This is in the data exploration collection, and Microsoft's sample prompts ask what would happen if a node were compromised.","mcpd");

q(3,C5,"You find a useful hunting query and want it to produce alerts going forward. What do you do?",["Create an analytics rule from it"],["Export it to Purview","Store it in a DCR","Save it only as a workbook"],"You can promote a hunting query to a detection, and bookmarks can preserve what you found along the way.","hunt");
q(3,C5,"What does the hunting page's results delta help you spot?",["A change in a query's result count compared with an earlier period"],["Which analyst ran the query","Your exam score","Your license use"],"Use results and deltas to identify which hunting queries to investigate first.","hunt");
q(3,C5,"You want to choose Sentinel hunting queries that target credential access behavior. Which query metadata helps most?",["MITRE ATT&CK tactics and techniques"],["The query's data connector version","The workspace region","The query author's name"],"Hunting queries are mapped to tactics and techniques, so you can focus on specific attacker behavior.","hunt");

q(3,C6,"Which option should you use to run a scheduled query with joins across data lake tables, looking back several years?",["KQL job"],["Summary rule","Search job","NRT rule"],"KQL jobs support multiple tables, joins and unions, on-demand or daily, weekly, or monthly schedules, and up to 12 years of lookback.","jobs");
q(3,C6,"Which option summarizes high-volume firewall logs every 20 minutes into an analytics table?",["Summary rule"],["KQL job","Search job","Watchlist"],"Summary rules run every 20 minutes to 24 hours, and they store results in custom analytics tier tables.","jobs");
q(3,C6,"You need to hydrate a very large amount of data from one table, including data older than your data lake onboarding date. What do you use?",["Search job"],["KQL job","Summary rule","Custom detection"],"Search jobs handle a single table, up to 100 million records, with a 24-hour timeout. For data since onboarding, use KQL jobs.","jobs");

q(3,C6,"A workspace isn't onboarded to the data lake. You need to summarize its Basic tier data frequently. Which option fits?",["Summary rule"],["KQL job","Spark job","Sentinel Graph"],"KQL jobs require onboarding to the Sentinel data lake. Summary rules work with Auxiliary and Basic tiers in workspaces that aren't onboarded.","jobs");
q(3,C6,"Which pricing model applies to KQL jobs and search jobs?",["GB of data analyzed"],["Per analyst per month","Per incident closed","Per analytics rule"],"Summary rules on analytics tier data are free, with data scan pricing for Basic and Auxiliary tiers.","jobs");

q(3,C7,"What does the Sentinel MCP server provide?",["A hosted interface that gives AI agents scenario-focused security tools"],["A new agent for Linux logs","A replacement for Entra ID","An on-premises SIEM appliance"],"It's fully hosted, needs no infrastructure deployment, and uses Microsoft Entra for identity.","mcp");
q(3,C7,"What does connecting to Sentinel MCP let a notebook or agent do?",["Query and reason over Sentinel data lake and Defender data using natural-language security tools"],["Bypass role assignments","Delete tenant audit logs","Install agents on devices"],"Tool collections reduce the need to know each schema or write every query by hand. Identity and permissions still apply.","mcp");
q(3,C7,"Which scenarios are in scope for Sentinel MCP collections? (Choose two.)",["Data exploration","Incident triage and threat hunting"],["Exam registration","Password reset self-service"],"Microsoft lists data exploration, agent building, and incident triage and hunting as common tasks.","mcp");
q(3,C7,"Your team is estimating Sentinel MCP costs. Which activity incurs charges?",["Graph queries made through the MCP graph tool"],["Connecting a client to the MCP server","Viewing a hunting graph in the Defender portal","Viewing blast radius in the incident graph"],"Connecting is free, and the portal's hunting graph and blast radius visualizations have no consumption charges. Graph queries through the MCP tool, and custom graph work in notebooks, are billed.","bill");

q(2,B14,"Which Sentinel rule types automatically create incidents for the alerts they generate?",["Scheduled and NRT rules"],["Anomaly rules","Hunting queries","Summary rules"],"Microsoft's threat detection page states this, while alerts ingested from external services don't create their own incidents.","threat");
q(2,B14,"What do Microsoft security rules do in Sentinel?",["Create Sentinel incidents from alerts generated in other Microsoft security solutions"],["Generate alerts from raw logs","Run Logic Apps on a schedule","Rotate workspace keys"],"They aren't available when Defender XDR incident integration is on, because Defender XDR creates the incidents instead.","threat");
q(2,B14,"You onboard a workspace to the Defender portal. What happens to the Fusion rule?",["It's disabled and replaced by the Defender XDR correlation engine"],["It moves to the data lake tier","It runs twice as often","It becomes an automation rule"],"Fusion is called Advanced multistage attack detection in Sentinel. Older material may not mention this change.","fus");

/* ---------- KQL practice ---------- */
const KQL=[];
function k(lv,g,title,prompt,schema,answer,checks,why,starter){KQL.push({lv,g,title,prompt,schema,answer,checks,why,starter,id:"k:"+hash(title)})}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
const K1="Filter and shape",K2="Summarize",K3="Time and variables",K4="Joins and JSON",K5="Threat hunts",K6="Sentinel logs",K7="Fix the bug";
k(1,K1,"Peek at a table","Show any 10 rows from DeviceEvents so you can see what the data looks like.","DeviceEvents",`DeviceEvents
| take 10`,[["Uses DeviceEvents",/\bDeviceEvents\b/],["Limits rows with take or limit, to 10",/\|\s*(take|limit)\s+10\b/i]],"take returns an arbitrary set of rows, so it's a cheap way to explore. It isn't sorted.");
k(1,K1,"See a table's columns","List the columns and types of DeviceProcessEvents.","DeviceProcessEvents",`DeviceProcessEvents
| getschema`,[["Uses DeviceProcessEvents",/\bDeviceProcessEvents\b/],["Uses getschema",/\|\s*getschema\b/i]],"getschema is useful when you can't remember a column name.");
k(1,K1,"Failed device logons","Show failed logons from the last 24 hours, with the time, device, account, and logon type.","DeviceLogonEvents: Timestamp, DeviceName, AccountName, LogonType, ActionType",`DeviceLogonEvents
| where Timestamp > ago(1d)
| where ActionType == "LogonFailed"
| project Timestamp, DeviceName, AccountName, LogonType`,[["Uses DeviceLogonEvents",/\bDeviceLogonEvents\b/],["Filters to the last day",/ago\(\s*(1d|24h)\s*\)/i],["Filters ActionType to LogonFailed",/ActionType\s*(==|=~)\s*"LogonFailed"/i],["Selects columns with project",/\|\s*project\b/i]],"ActionType LogonFailed marks the failure. Put the time filter first.");
k(1,K1,"Case-insensitive process match","Find PowerShell processes, whatever the casing of the file name.","DeviceProcessEvents: Timestamp, DeviceName, FileName, ProcessCommandLine",`DeviceProcessEvents
| where FileName =~ "powershell.exe"`,[["Uses DeviceProcessEvents",/\bDeviceProcessEvents\b/],["Uses =~ on FileName",/FileName\s*=~\s*"powershell\.exe"/i]],"== is case sensitive, so POWERSHELL.EXE would be missed. =~ isn't.");
k(1,K1,"Search for a term","Find command lines containing the whole term mimikatz.","DeviceProcessEvents: ProcessCommandLine",`DeviceProcessEvents
| where ProcessCommandLine has "mimikatz"`,[["Uses DeviceProcessEvents",/\bDeviceProcessEvents\b/],["Uses has on ProcessCommandLine",/ProcessCommandLine\s+has\s+"mimikatz"/i]],"has uses the term index, so it's faster than contains for whole terms.");
k(1,K1,"Match a list of tools","Find processes named psexec.exe, wmic.exe, or mshta.exe, in any casing.","DeviceProcessEvents: FileName",`DeviceProcessEvents
| where FileName in~ ("psexec.exe", "wmic.exe", "mshta.exe")`,[["Uses DeviceProcessEvents",/\bDeviceProcessEvents\b/],["Uses in~",/FileName\s+in~\s*\(/i],["Includes all three names",/psexec\.exe[\s\S]*wmic\.exe[\s\S]*mshta\.exe|mshta\.exe[\s\S]*wmic\.exe[\s\S]*psexec\.exe/i]],"in~ is the case-insensitive version of in.");
k(1,K1,"Unique devices","List each device that had a failed logon, once only.","DeviceLogonEvents: DeviceName, ActionType",`DeviceLogonEvents
| where ActionType == "LogonFailed"
| distinct DeviceName`,[["Filters to LogonFailed",/LogonFailed/i],["Returns unique devices",/\|\s*(distinct\s+DeviceName|summarize\s+by\s+DeviceName)/i]],"distinct returns unique combinations of the named columns.");
k(1,K1,"Newest 20 events","Show the 20 most recent process events.","DeviceProcessEvents: Timestamp",`DeviceProcessEvents
| top 20 by Timestamp desc`,[["Uses DeviceProcessEvents",/\bDeviceProcessEvents\b/],["Returns the newest 20",/\|\s*top\s+20\s+by\s+Timestamp(\s+desc)?|\|\s*(sort|order)\s+by\s+Timestamp(\s+desc)?\s*\|\s*(take|limit)\s+20/i]],"top sorts descending by default, and combines sort and take.");
k(2,K2,"Failures per account","Count failed Windows logons per account, highest first.","SecurityEvent: EventID, Account",`SecurityEvent
| where EventID == 4625
| summarize Failures = count() by Account
| sort by Failures desc`,[["Uses SecurityEvent",/\bSecurityEvent\b/],["Filters EventID 4625",/EventID\s*==\s*4625/],["Counts by Account",/summarize[\s\S]*count\(\)[\s\S]*by\s+Account/i],["Sorts the result",/\|\s*(sort|order|top)\b/i]],"4625 is a failed logon, and 4624 is a successful one.");
k(2,K2,"Password spray","Find IP addresses with invalid-password failures against more than 20 different users.","SigninLogs: ResultType (string), UserPrincipalName, IPAddress",`SigninLogs
| where ResultType == "50126"
| summarize Users = dcount(UserPrincipalName) by IPAddress

al(L1,"Possible Golden SAML attack","High","SAML tokens may be forged using a stolen federation signing key.","Review AD FS or federation servers, and rotate the token-signing certificate.","idr");

function mergeState(a,b){
 const r=Math.max(a.resetAt||0,b.resetAt||0),s={},st={},as=a.store||{},bs=b.store||{},at=a.starT||{},bt=b.starT||{};
 new Set([...Object.keys(as),...Object.keys(bs)]).forEach(id=>{const x=as[id],y=bs[id];const w=!x?y:!y?x:((x.t||0)>(y.t||0)||((x.t||0)===(y.t||0)&&(x.n||0)>=(y.n||0)))?x:y;if((w.t||0)>=r)s[id]=w});
 new Set([...Object.keys(at),...Object.keys(bt)]).forEach(id=>{const x=at[id],y=bt[id];st[id]=!x?y:!y?x:((x.t||0)>(y.t||0)||((x.t||0)===(y.t||0)&&x.on))?x:y});

function queueSync(ms){if(!sync.ref)return;clearTimeout(sync.timer);sync.timer=setTimeout(flushSync,ms===undefined?1500:ms)}
async function flushSync(){
 clearTimeout(sync.timer);if(!sync.ref)return;
 if(sync.busy){sync.again=true;return}
 sync.busy=true;
 try{
  const snap=await sync.ref.get();
  const remote=snap.exists?JSON.parse(JSON.stringify(snap.data())):{};
  const m=mergeState(localState(),remote);
  if(stable(m)!==stable(localState())){applyState(m);refreshAfterSync()}
  const rp={store:remote.store||{},starT:remote.starT||{},resetAt:remote.resetAt||0};
  if(stable(m)!==stable(rp))await sync.ref.set({...m,updatedAt:Date.now()});
  const saved=Object.keys(m.store).length;sync.detail=`${saved} answer${saved===1?"":"s"} saved, last checked ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}.`;
  sync.retried=false;setSync("on");
 }catch(err){
  const c=err&&err.code;

  else if(c==="invalid_argument"||c==="revoked"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"||c==="transform_error"){sync.ref=null;setSync("off")}
  else{setSync("slow");if(!sync.retried){sync.retried=true;queueSync(2000+Math.random()*3000)}}
 }finally{sync.busy=false;if(sync.again){sync.again=false;queueSync(0)}}
}

 sync.ref.onSnapshot(snap=>{

  if(snap.exists){const m=mergeState(localState(),JSON.parse(JSON.stringify(snap.data())));if(stable(m)!==stable(localState())){applyState(m);refreshAfterSync()}}
  if(!snap.metadata.fromCache&&!sync.started){sync.started=true;queueSync(0)}
 },()=>{clearTimeout(sync.loadTimer);sync.ref=null;setSync("off")});
}

const drill={scope:"all",list:[],i:0,picked:[],done:false,score:0,count:0};
function pool(sc){if(sc==="missed")return Q.filter(isMissed);if(sc==="starred")return Q.filter(x=>stars[x.id]);if(sc==="practice")return Q.filter(isPri);if(sc==="new")return Q.filter(x=>!store[x.id]);if(/^d\d$/.test(sc))return Q.filter(x=>x.d==sc[1]);if(sc.startsWith("t:"))return Q.filter(x=>x.t===sc.slice(2));return Q}
function scopeOptions(sel){let h=`<option value="all">All questions (${Q.length})</option><option value="new">Not yet answered</option><option value="missed">Missed questions</option><option value="starred">Starred questions</option><option value="practice">Missed and starred</option>`;[1,2,3].forEach(d=>{h+=`<optgroup label="Domain ${d}: ${e(DOM[d].n)}"><option value="d${d}">All of Domain ${d}</option>${TOPICS[d].map(t=>`<option value="t:${e(t)}">${e(t)} (${Q.filter(x=>x.t===t).length})</option>`).join("")}</optgroup>`});return `<select id="scope">${h}</select>`.replace(`value="${e(sel)}"`,`value="${e(sel)}" selected`)}
function startDrill(){drill.list=shuffle(pool(drill.scope));drill.i=0;drill.picked=[];drill.done=false;drill.score=0;drill.count=0;vDrill()}
function vDrill(){
 if(!drill.list.length&&drill.count===0){drill.list=shuffle(pool(drill.scope))}

 if(!x){body=drill.count?`<section class="card"><h2>Set finished</h2><p>You got ${drill.score} of ${drill.count} right.</p><button class="btn" id="again">Go again</button></section>`:`<section class="card"><h2>Nothing here yet</h2><p class="muted">This set is empty. Pick another one above.</p></section>`}
 else{

 }

 document.getElementById("scope").onchange=ev=>{drill.scope=ev.target.value;startDrill()};
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(drill.done)return;const i=+b.dataset.i;if(x.multi){drill.picked=drill.picked.includes(i)?drill.picked.filter(v=>v!==i):[...drill.picked,i];if(drill.picked.length>x.c.length)drill.picked.shift();vDrill()}else{drill.picked=[i];finish(x)}});

 <li><b>Alert vs incident:</b> an alert is one signal, and an incident is a container of related alerts that tells the attack's story.</li>

 <section class="card"><h3>Alerts you could build yourself</h3><p class="small muted">These are my examples for practice, not Microsoft's built-in alerts. As a scheduled rule or custom detection, each can raise alerts and incidents. Thresholds need tuning for your environment.</p>${BUILD.map(([n,m,code])=>`<details><summary>${e(n)}</summary><div class="stack"><p class="small">${e(m)}</p><pre>${e(code)}</pre></div></details>`).join("")}</section>
 <section class="card"><h3>Full lists from Microsoft</h3><p class="small muted">Microsoft notes that some recent alerts may be undocumented, and doesn't publish one complete list for Defender for Endpoint.</p><div class="row"><a class="small" href="${href("idr")}" target="_blank" rel="noopener">Defender for Identity</a><a class="small" href="${href("risk")}" target="_blank" rel="noopener">Entra risk detections</a><a class="small" href="${href("mdaa")}" target="_blank" rel="noopener">Cloud Apps</a><a class="small" href="https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-reference" target="_blank" rel="noopener">Defender for Cloud</a><a class="small" href="${href("fscn")}" target="_blank" rel="noopener">Fusion scenarios</a><a class="small" href="${href("anr")}" target="_blank" rel="noopener">Sentinel anomalies</a></div></section>`;
 const paint=()=>{const term=alv.s.trim().toLowerCase();const hit=ALERTS.filter(a=>(alv.g==="all"||a.g===alv.g)&&(!term||[a.n,a.m,a.f,a.g].join(" ").toLowerCase().includes(term)));const gs=[...new Set(hit.map(a=>a.g))];
  document.getElementById("all").innerHTML=gs.length?gs.map(g=>`<div class="stack" style="gap:8px"><span class="eyebrow">${e(g)} · ${hit.filter(a=>a.g===g).length}</span>${hit.filter(a=>a.g===g).map(a=>`<details class="card topic"><summary><b>${e(a.n)}</b>${a.sev?`<span><span class="tag ${a.sev==="High"?"bad":"warn"}">${e(a.sev)}</span></span>`:""}</summary><p class="small"><b>What it suggests:</b> ${e(a.m)}</p><p class="small"><b>First steps:</b> ${e(a.f)}</p><a class="small" href="${href(a.src)}" target="_blank" rel="noopener">Source</a></details>`).join("")}</div>`).join(""):`<p class="muted">No alerts match that search.</p>`};
 document.getElementById("alg").onchange=ev=>{alv.g=ev.target.value;paint()};
 document.getElementById("als").oninput=ev=>{alv.s=ev.target.value;paint()};paint();
}
